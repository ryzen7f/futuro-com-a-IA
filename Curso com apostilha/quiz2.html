<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Curso de IA</title>
    <style>
              body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .caixa-quiz {
            background-color: #ffffff;
            border: solid 2px #0050fc;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 2000px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(10, 10, 10, 0.5);
        }
        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-opcao {
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: solid 2px #0050fc;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-opcao:hover {
            background-color: #0050fc;
            border-color: #00a2ff;
        }
        .btn-voltar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }

        @media (max-width: 600px) {

    body {
        padding: 10px;
        justify-content: center;
    }

    .caixa-quiz {
        width: 100%;
        max-width: 100%;
        padding: 20px;
    }

    .caixa-quiz h3 {
        font-size: 18px;
        line-height: 1.4;
    }

    .opcoes-container {
        gap: 10px;
        margin-top: 15px;
    }

    .btn-opcao {
        width: 100%;
        padding: 14px 12px;
        font-size: 15px;
        line-height: 1.3;
        box-sizing: border-box;
    }

    .btn-voltar {
        width: 100%;
        font-size: 15px;
        padding: 13px;
    }
}
    </style>
</head>
<body>

    <div class="caixa-quiz" id="conteudo-quiz">
        
    </div>

    <script>
        // Banco de dados com as perguntas do módulo Intermediário
        const perguntasIntermediario = [
            { enunciado: "1. O que é Few-Shot Prompting (Aprendizado por Exemplos)?", opcoes: ["É ensinar um conteúdo.", "É dar exemplos do que deseja antes de fazer o pedido.", "É não dar exemlos e fazer de qualquer maneira.", "Todas as alternativas estão erradas."], correta: 1 },
            { enunciado: "2. Pra que serve o Chain of Thought (Cadeia de Pensamento)?", opcoes: ["Serve para tirar dúvidas.", "Serve como aprendizado por exemplos.", "Serve pra ensinar a como criar.", "Serve pra ativar a lógica para obter um melhor resultado."], correta: 3 },
            { enunciado: "3. O que você aprende no nível intermdiário?", opcoes: ["Aprende apenas o necessário.", "Aprende a programar e criar a própria ferramenta.", "Aprende o básico sobre IA.", "Aprende a extrair resultados e a lidar com muitas informações"], correta: 3 },
            { enunciado: "4. Por que usar o v0(vercel)?", opcoes: ["Ajuda no desenvolvimento de interfaces.", "Tem as mesmas funções que todas as IAs.", "É péssima, não serve pra nada.", "É muito útil pra dar dicas."], correta: 0 },
            { enunciado: "5. Por que usar o claude(Anthrofic)?", opcoes: ["Tem capacidade de automação, fazer tudo sozinho.", "Capacidade superior de interpretação de texto, e lógica matemática", "É a melhor ferramenta em cálculo e tecnologia da atualidade.", "Ela tem os melhores chatbots para usuários."], correta: 1 },
            { enunciado: "6. Por que usar o Midjourney?", opcoes: ["É a ferramenta com o maior poder absurdo de cálculos do mundo.", "É capaz de criar poesias perfeitas do zero.", "É líder mundial em qualidade visual e fotorrealismo.", "Ela pode ensinar vários idiomas."], correta: 2 },
            { enunciado: "7. Qual é a importância dessas ferramentas de inteligência artificial?", opcoes: ["Facilita no desenvolvimento de designs e tem melhores interpretações de texto.", "Melhoram o seu bem-estar, ajudando com dicas de bons hábitos.", "Elas criam várias IAs, dessa maneira, a tecnologia dessas ferramentas melhoram a cada dia.", "Auxiliam no seu dia a dia com técnicas de trabalho."], correta: 0 },
            { enunciado: "8. Situação: Uma empresa precisa que você faça uma tela de cadastro pro site dela, qual ferramenta deve ser usada?", opcoes: ["Claude(Anthrofic)", "Midjourney", "Chatgpt", "v0(Vercel)"], correta: 3 },
            { enunciado: "9. Situação: Você tem uma loja, e precisa fazer a sua própria logo, qual ferramenta deve ser usada?", opcoes: ["Qualquer IA.", "Midjourney", "Claude(Anthrofic)", "v0(Vercel)"], correta: 1 },
            { enunciado: "10. Situação: Você precisa analisar todos gastos da sua empresa, e todos eles estão em uma planilha enorme, qual ferramenta deve ser usada?", opcoes: ["Midjourney", "Canva.IA", "v0(Vercel)", " Claude(Anthrofic)"], correta: 3 }
        ];

        let perguntaAtual = 0;
        let acertos = 0;
        const caixaQuiz = document.getElementById("conteudo-quiz");

        function carregarQuestao() {
            caixaQuiz.innerHTML = ""; 

            // CORREÇÃO: Agora checa o tamanho da lista correta (perguntasIntermediario)
            if (perguntaAtual < perguntasIntermediario.length) {
                const questao = perguntasIntermediario[perguntaAtual]; // CORREÇÃO: Pega a pergunta da lista certa

                const titulo = document.createElement("h3");
                titulo.innerText = questao.enunciado;
                caixaQuiz.appendChild(titulo);

                const containerOpcoes = document.createElement("div");
                containerOpcoes.className = "opcoes-container";

                questao.opcoes.forEach((opcao, index) => {
                    const btn = document.createElement("button");
                    btn.className = "btn-opcao";
                    btn.innerText = opcao;
                    btn.onclick = () => {
                        if (index === questao.correta) acertos++;
                        perguntaAtual++;
                        carregarQuestao(); 
                    };
                    containerOpcoes.appendChild(btn);
                });
                containerOpcoes.style.display = "flex";
                containerOpcoes.style.flexDirection = "column";
                containerOpcoes.style.gap = "10px";
                containerOpcoes.style.marginTop = "15px";
                caixaQuiz.appendChild(containerOpcoes);
            } else {
                finalizarAvaliacao();
            }
        }

        function finalizarAvaliacao() {
            if (acertos >= 10) {
                caixaQuiz.innerHTML = `
                    <h2>🎉 Parabéns, você passou!</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="retornarComSucesso()" class="btn-voltar">Desbloquear Módulo Profissional</button>
                `;
            } else {
                caixaQuiz.innerHTML = `
                    <h2>❌ Nota insuficiente</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="window.location.reload();" class="btn-voltar" style="background:#ff3333;">Tentar Novamente</button>
                `;
            }
        }

        // CORREÇÃO: Manda de volta injetando o 'qz2=passou' que destrava o nível profissional
        function retornarComSucesso() {
            window.location.href = "index.html?qz2=passou";
        }

        // Inicia o quiz ao abrir a página
        carregarQuestao();
    </script>
</body>
</html>
