<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Curso de IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .caixa-quiz {
            background-color: #ffffff;
            border: solid 2px #0050fc;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 2000px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(10, 10, 10, 0.5);
        }
        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-opcao {
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: solid 2px #0050fc;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-opcao:hover {
            background-color: #0050fc;
            border-color: #00a2ff;
        }
        .btn-voltar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }

        @media (max-width: 600px) {

    body {
        padding: 10px;
        justify-content: center;
    }

    .caixa-quiz {
        width: 100%;
        max-width: 100%;
        padding: 20px;
    }

    .caixa-quiz h3 {
        font-size: 18px;
        line-height: 1.4;
    }

    .opcoes-container {
        gap: 10px;
        margin-top: 15px;
    }

    .btn-opcao {
        width: 100%;
        padding: 14px 12px;
        font-size: 15px;
        line-height: 1.3;
        box-sizing: border-box;
    }

    .btn-voltar {
        width: 100%;
        font-size: 15px;
        padding: 13px;
    }
}
    </style>
</head>
<body>

    <div class="caixa-quiz" id="conteudo-quiz">
        <!-- O JavaScript vai injetar as perguntas aqui -->
    </div>

    <script>
        // Banco de dados com as 10 perguntas do módulo Iniciante
        const perguntasIniciante = [
            { enunciado: "1. Como a IA generativa responde a suas perguntas?", opcoes: ["Ela usa o próprio conhecimento para tirar suas dúvidas.", "Ela pega conteudos escritos da internet e calcula qual é a palavra mais provável que deve vir na frase para responder.", "É alguém que está se passando por uma Inteligência Artificial, e respondendo rápidamente.", "Todas as alternativas estão incorretas."], correta: 1 },
            { enunciado: "2. O que é Prompt? Assinale a alternativa correta.", opcoes: ["Prompt é o nome de um tipo de IA generativa.", "É uma sigla de uma empresa milionária focada em tecnologia.", "É uma palavra que quando digitada no chat de alguma IA, libera funções extras para o usuário.", " É um comando ou pergunta que você digita na caixa de texto de uma IA ."], correta: 3 },
            { enunciado: "3. O que significa a sigla R.C.T?", opcoes: ["Refaça Construa e Treine.", "Reapeat(Repita), Create(Crie), Test(Teste)", "Reorganize Com Textos.", "Role(Papel), Context(Contexto), Task(Tarefa)."], correta: 3 },
            { enunciado: "4. O que as IAs conseguem fazer? Assinale a alternativa incorreta.", opcoes: ["Criar histórias, poemas, frases do zero.", "Responder dúvidas do usuário.", "gerar imagens com base na descrição do usuário.", "Resumir textos."], correta: 0 },
            { enunciado: "5. Quando e onde foi criado o primeiro neurônio artificial?", opcoes: ["Em 1948 nos Estados Unidos.", "Em 1943 nos Estados Unidos.", "Em 1950 no Reino Unido.", "Em 1946 no Reino Unido."], correta: 1 },
            { enunciado: "6. Quem era o organizador da conferência de Dartmouth em 1956?", opcoes: ["Alan Turing.", "Warren McCulloch.", "John McCarthy.", "Marvin Minsky."], correta: 2 },
            { enunciado: "7. Uma década depois, em 1966, Joseph Weizenbaum consolidaria essa era ao criar a ELIZA. O que era a ELIZA?", opcoes: ["Um chatbot.", "Um super computador.", "Uma IA generativa.", "Um androide."], correta: 0 },
            { enunciado: "8. O que ocorreu entre 1974 e 1980?", opcoes: ["O terceiro inverno da IA.", "A Conferência de Dartmouth.", "O segundo inverno da IA.", "O primeiro inverno da IA."], correta: 3 },
            { enunciado: "9. Resumindo, O que é IA?", opcoes: ["É um robô com consciencia.", "É uma tecnologia que aprende sozinha, e faz calculos para obter respostas.", "É uma tecnologia altamente inteligente ao ponto de fazer qualquer coisa.", "É um aplicativo de mensagens."], correta: 1 },
            { enunciado: "10. Por que em 1974 à 1980, os governos dos EUA e do Reino Unido cortaram drasticamente as verbas de pesquisa de maquinas totalmente inteligentes?", opcoes: ["Porque estavam em guerra, e não podiam continuar a pesquisa.", "Porque os cientistas abandonaram o projeto.", "Porque faltava orçamento.", " Porque os computadores não tinham memória nem poder de processamento para lidar."], correta: 3 }
        ];

        let perguntaAtual = 0;
        let acertos = 0;
        const caixaQuiz = document.getElementById("conteudo-quiz");

        // O SEGREDO DA OPÇÃO 2: Lê qual nível o aluno deve responder olhando a URL
        const parametrosUrl = new URLSearchParams(window.location.search);
        const nivelSelecionado = parametrosUrl.get("nivel");

        function carregarQuestao() {
            caixaQuiz.innerHTML = ""; // Limpa a tela

            if (perguntaAtual < perguntasIniciante.length) {
                const questao = perguntasIniciante[perguntaAtual];

                const titulo = document.createElement("h3");
                titulo.innerText = questao.enunciado;
                caixaQuiz.appendChild(titulo);

                const containerOpcoes = document.createElement("div");
                containerOpcoes.className = "opcoes-container";

                questao.opcoes.forEach((opcao, index) => {
                    const btn = document.createElement("button");
                    btn.className = "btn-opcao";
                    btn.innerText = opcao;
                    btn.onclick = () => {
                        if (index === questao.correta) acertos++;
                        perguntaAtual++;
                        carregarQuestao(); // Vai para a próxima pergunta
                    };
                    containerOpcoes.appendChild(btn);
                });
                caixaQuiz.appendChild(containerOpcoes);
            } else {
                finalizarAvaliacao();
            }
        }

        function finalizarAvaliacao() {
            // Se tirar nota 10 ou mais, gera o link de aprovação para mandar de volta
            if (acertos >= 10) {
                caixaQuiz.innerHTML = `
                    <h2>🎉 Parabéns, você passou!</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="retornarComSucesso()" class="btn-voltar">Desbloquear Módulo Intermediário</button>
                `;
            } else {
                caixaQuiz.innerHTML = `
                    <h2>❌ Nota insuficiente (Abaixo de 10)</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="window.location.reload();" class="btn-voltar" style="background:#ff3333;">Tentar Novamente</button>
                `;
            }
        }

        // Envia o aluno de volta fofocando pelo link que ele passou
        function retornarComSucesso() {
            window.location.href = "index.html?qz1=passou";
        }

        // Inicia o quiz ao abrir a página
        carregarQuestao();
    </script>
</body>
</html>
