<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra do curso</title>
    <link rel="icon" href="IAicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        .compra {
            border: solid 1px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(compra.png);
            width: 100%;
        }

        .campo-compra {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 85%;
        }

        .campo-compra p {
            text-align: center;
        }

        form {
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 37%;
            background-color: rgba(227, 234, 233, 0.925);
            border-radius: 10px;
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form label {
            text-align: start;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
        }

        form input {
            border-radius: 7px;
            height: 4%;
            width: 85%;
        }

        form input:focus {
            border-color: rgb(70, 130, 255);
            box-shadow: 0 0 5px rgba(70, 130, 255, 0.5);
            outline: none;
        }

        .campo-senha {
            display: flex;
            align-items: center;
            width: 85%;
            height: 4%;
        }

        .campo-senha input {
            width: 100%;
            height: 100%;
        }

        /* Esconde o olho automático do Edge */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .olho {
            margin-left: -40px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        form p {
            text-align: start;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
        }

        .confirmar {
            background-color: rgb(95, 255, 47);
            width: 85%;
            height: 5%;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .confirmar:hover {
            background-color: rgb(75, 220, 35);
            transform: scale(1.02);
        }

        @media (max-width: 1000px) {
            .compra {
                min-height: 100vh;
            }

            .campo-compra {
                width: 100%;
            }

            form {
                width: 100%;
            }

            .sobrenos {
                display: flex;
                flex-direction: column;
            }
        }
    </style>
    <script>
        function mostrarSenha() {
            const senha = document.getElementById("senha");

            if (senha.type === "password") {
                senha.type = "text";
            } else {
                senha.type = "password";
            }
        }
    </script>
</head>

<body>
    <main>
        <section class="compra" id="compra">

            <div class="campo-compra">

                <form action="">

                    <label for="nome">Nome</label><br>
                    <input type="text" id="nome" name="nome" required><br>

                    <label for="sobrenome">Sobrenome</label><br>
                    <input type="text" id="sobrenome" name="sobrenome" required><br>

                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" required><br>

                    <label for="senha">Senha</label><br>

                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" required>
                        <button type="button" class="olho" onclick="mostrarSenha()">𖠂</button>
                    </div><br>
                    <label for="cpf">CPF</label><br>
                    <input type="text" id="cpf" name="cpf" required><br>

                    <label for="nascimento">Data de nascimento</label><br>
                    <input type="date" id="nascimento" name="nascimento" required><br>

                    <button class="confirmar" type="submit">Confirmar</button>

                    <p>Seu nome de perfil não será compartilhado. Nunca envie senhas.</p>

                </form>

            </div>

        </section>
    </main>
</body>

</html>
