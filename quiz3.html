<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Curso de IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .caixa-quiz {
            background-color: #1c1c1c;
            border: solid 2px #0050fc;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-opcao {
            background-color: #333333;
            color: white;
            border: solid 1px #555555;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-opcao:hover {
            background-color: #0050fc;
            border-color: #00a2ff;
        }
        .btn-voltar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="caixa-quiz" id="conteudo-quiz">
        <!-- O JavaScript vai injetar as perguntas aqui -->
    </div>

    <script>
        // Banco de dados com as 10 perguntas do módulo Iniciante
        const perguntasProfissional = [
            { enunciado: "1. Qual é o objetivo do nível profissional?", opcoes: ["Construir uma inteligência artificial poderosa.", "Automatizar o trabalho integrando-se aos sistemas da empresa.", "Solucionar e corrigir erros feitos por ferramentas de IA.", "Aprender a usar qualquer IA existente."], correta: 1 },
            { enunciado: "2. O que é o API?", opcoes: ["Prompt é o nome de um tipo de IA generativa.", "É uma sigla de uma empresa milionária focada em tecnologia.", "É uma palavra que quando digitada no chat de alguma IA, libera funções extras para o usuário.", " É um comando ou pergunta que você digita na caixa de texto de uma IA ."], correta: 3 },
            { enunciado: "3. O que realmente é o No-Code?", opcoes: ["Refaça Construa e Treine.", "Reapeat(Repita), Create(Crie), Test(Teste)", "Reorganize Com Textos.", "Role(Papel), Context(Contexto), Task(Tarefa)."], correta: 3 },
            { enunciado: "4. Qual é a ferramenta que contém as funçôes API e No-Code?", opcoes: ["Criar histórias, poemas, frases do zero.", "Responder dúvidas do usuário.", "gerar imagens com base na descrição do usuário.", "Resumir textos."], correta: 0 },
            { enunciado: "5. O que a ferramenta Cursor faz?", opcoes: ["Em 1948 nos Estados Unidos.", "Em 1943 nos Estados Unidos.", "Em 1950 no Reino Unido.", "Em 1946 no Reino Unido."], correta: 1 },
            { enunciado: "6. O que a ferramenta ElevenLabs faz?", opcoes: ["Alan Turing.", "Warren McCulloch.", "John McCarthy.", "Marvin Minsky."], correta: 2 },
            { enunciado: "7. Quais problemas ocorrem quando uma IA é implementada sem governaça?", opcoes: ["Processos contra a empresa, multas e crises graves de imagem.", "Não ocorre nada pois a IA é totalmente segura e confiável.", "Atraso tecnológico e grandes custos.", "Ocorrem problemas principalmente com a população."], correta: 0 },
            { enunciado: "8. Qual a importância do aluno aprender a fazer auditorias de dados?", opcoes: ["Para saber destinguir problemas e funções da IA.", "Para não corrigir erros que a IA comete.", "Para ensinar a IA não repetir o erro.", "Para indentificar e corrigir desequilíbrios das ferramentas de IA."], correta: 3 },
            { enunciado: "9. O profissional precisa seguir um processo claro de governança, qual é esse processo?", opcoes: ["Analisar o erro, solucionar ele e confirmar que foi finalizado com sucesso.", "Rastrear a origem dos dados, testar a IA no extremo e criar relatórios detalhados.", "Verificar os dados, depois usar eles na IA e perguntar se pode usar eles.", "Investigar os dados fornecidos, fazer teste e deixar de lado."], correta: 1 },
            { enunciado: "10. Situação: Você é um programador e está com dificuldades em desenvolver e solucionar erros de códigos, qual ferramenta se encaixa nesse problema?", opcoes: ["Midjourney.", "v0(Vercel).", "Make.", "Cursor."], correta: 3 }
        ];

        let perguntaAtual = 0;
        let acertos = 0;
        const caixaQuiz = document.getElementById("conteudo-quiz");

        // O SEGREDO DA OPÇÃO 2: Lê qual nível o aluno deve responder olhando a URL
        const parametrosUrl = new URLSearchParams(window.location.search);
        const nivelSelecionado = parametrosUrl.get("nivel");

        function carregarQuestao() {
            caixaQuiz.innerHTML = ""; // Limpa a tela

            if (perguntaAtual < perguntasIniciante.length) {
                const questao = perguntasIniciante[perguntaAtual];

                const titulo = document.createElement("h3");
                titulo.innerText = questao.enunciado;
                caixaQuiz.appendChild(titulo);

                const containerOpcoes = document.createElement("div");
                containerOpcoes.className = "opcoes-container";

                questao.opcoes.forEach((opcao, index) => {
                    const btn = document.createElement("button");
                    btn.className = "btn-opcao";
                    btn.innerText = opcao;
                    btn.onclick = () => {
                        if (index === questao.correta) acertos++;
                        perguntaAtual++;
                        carregarQuestao(); // Vai para a próxima pergunta
                    };
                    containerOpcoes.appendChild(btn);
                });
                caixaQuiz.appendChild(containerOpcoes);
            } else {
                finalizarAvaliacao();
            }
        }

        function finalizarAvaliacao() {
            // Se tirar nota 10 ou mais, gera o link de aprovação para mandar de volta
            if (acertos >= 10) {
                caixaQuiz.innerHTML = `
                    <h2>🎉 Parabéns, você concluiu!</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="retornarComSucesso()" class="btn-voltar"></button>
                `;
            } else {
                caixaQuiz.innerHTML = `
                    <h2>❌ Nota insuficiente (Abaixo de 10)</h2>
                    <p>Você acertou <strong>${acertos} de 10</strong> perguntas.</p>
                    <button onclick="window.location.reload();" class="btn-voltar" style="background:#ff3333;">Tentar Novamente</button>
                `;
            }
        }

        // Envia o aluno de volta fofocando pelo link que ele passou
        function retornarComSucesso() {
            window.location.href = "cursoIA2.html?qz1=passou";
        }

        // Inicia o quiz ao abrir a página
        carregarQuestao();
    </script>
</body>
</html>
